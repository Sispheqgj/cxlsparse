[project]
name = "cxl-recsys"
version = "0.1.0"
description = "NSA memory-semantic KV cache pool for generative recommendation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.14.0",
    "numpy==2.5.3",
    "grpcio==1.83.1",
    "apache-tvm-ffi==0.1.13.post3",
    "ninja==1.13.2",
    "PyYAML>=6.0.2,<7",
    "tokenizers==0.23.2",
    "ijson==3.5.1",
    "orjson==3.13.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff>=0.12,<1"]
nsa = ["safetensors>=0.4.5,<1"]

[project.scripts]
cxl-recsys = "cxl_recsys.cli:main"

[tool.uv]
environments = ["sys_platform == 'linux'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cxl_recsys", "third_party/GR", "third_party/nsa_runtime"]
sources = {"third_party/GR" = "GR", "third_party/nsa_runtime" = "nsa_runtime"}

[tool.hatch.build]
dev-mode-dirs = [".", "third_party"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires CUDA and prebuilt HiSparse/CXL libraries", "rdma: requires an active verbs port"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
include = ["cxl_recsys", "scripts", "tests"]
exclude = [".venv", "third_party", "artifacts"]
pythonVersion = "3.12"
pythonPlatform = "Linux"
typeCheckingMode = "standard"
extraPaths = ["third_party"]
venvPath = "."
venv = ".venv"
