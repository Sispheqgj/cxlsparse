[project]
name = "cxl-recsys-nsa-tilelang-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.14.0",
    "numpy==2.5.3",
    "grpcio==1.83.1",
    "apache-tvm-ffi==0.1.12",
    "tilelang==0.1.13",
    "ninja==1.13.2",
    "PyYAML>=6.0.2,<7",
    "tokenizers==0.23.2",
    "ijson==3.5.1",
    "orjson==3.13.0",
    "safetensors>=0.4.5,<1",
    "pytest==9.1.1",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux'"]
